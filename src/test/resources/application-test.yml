spring:
  kafka:

    bootstrap-servers: ${spring.embedded.kafka.brokers}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: true

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
        max.poll.records: 10
        max.poll.interval.ms: 300000

    listener:
      ack-mode: manual_immediate
      type: single

    admin:
      fail-fast: false

app:
  kafka:
    topics:
      order-placed: order.placed
      payment-result: payment.result
      inventory-result: inventory.result
      shipping-result: shipping.result
      order-confirmed: order.confirmed
      order-failed: order.failed
      compensation: order.compensation
      order-placed-dlt: order.placed.DLT
      payment-result-dlt: payment.result.DLT
      inventory-result-dlt: inventory.result.DLT
      shipping-result-dlt: shipping.result.DLT
  notification:
    sla-minutes: 5
    scheduler-interval: 30000

server:
  port: 0   # random port to avoid conflicts during tests

logging:
  level:
    root: WARN
    com.example.DistributedKafkaOrderProcessing: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN