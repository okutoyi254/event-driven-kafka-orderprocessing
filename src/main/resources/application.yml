spring:
  application:
    name: hardware-store-kafka

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:hardware_store;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: localhost:29092

    admin:
      fail-fast: false

    # ── Producer ─────────────────────────────────────────────────────────────
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        batch.size: 16384
        compression.type: snappy
        # Do NOT add type headers — we disable header-based deserialization
        # on the consumer side, so headers just cause confusion
        spring.json.add.type.headers: false

    # ── Consumer ─────────────────────────────────────────────────────────────
    # Minimal config here — deserialization is handled explicitly in
    # KafkaConsumerConfig.java which creates the ConsumerFactory bean.
    # Only group-id and offset reset needed here.
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

    # ── Listener ─────────────────────────────────────────────────────────────
    listener:
      ack-mode: manual_immediate
      type: single

# ── Topic Names ───────────────────────────────────────────────────────────────
app:
  kafka:
    topics:
      order-placed: order.placed
      payment-result: payment.result
      inventory-result: inventory.result
      shipping-result: shipping.result
      order-confirmed: order.confirmed
      order-failed: order.failed
      compensation: order.compensation
      order-placed-dlt: order.placed.DLT
      payment-result-dlt: payment.result.DLT
      inventory-result-dlt: inventory.result.DLT
      shipping-result-dlt: shipping.result.DLT
  notification:
    sla-minutes: 5
    scheduler-interval: 30000

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: alpha

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.DistributedKafkaOrderProcessing: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN